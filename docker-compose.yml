version: '3.8'

services:
  superagent:
    build: .
    container_name: superagent-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPERAGENT_ENV=production
      - SUPERAGENT_DATABASE_PATH=/app/data/superagent.db
      - SUPERAGENT_STORAGE_PATH=/app/data/storage
    volumes:
      - superagent_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  superagent_data:
    driver: local
